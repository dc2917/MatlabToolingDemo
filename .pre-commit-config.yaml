repos:
  - repo: local
    hooks:
      - id: codeIssues
        name: codeIssues
        entry: bash -c "matlab -nodesktop -nojvm -nodisplay -r check_code"
        language: unsupported
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint-fix
