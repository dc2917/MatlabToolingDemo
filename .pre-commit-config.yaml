repos:
  - repo: local
    hooks:
      - id: mh_style
        name: mh_style
        entry: mh_style
        args: [--fix]
        files: ^(.*\.m)$
        language: python
        additional_dependencies: [miss_hit_core]
      - id: codeIssues
        name: codeIssues
        entry: bash -c "matlab -nodesktop -nojvm -nodisplay -r 'buildtool check'"
        files: ^(.*\.m)$
        language: unsupported
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint-fix
